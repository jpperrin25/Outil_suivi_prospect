# Variante ultra simple : pas de MySQL, tout est dans UN fichier ./data/alternance.db
# Lancer avec : docker compose -f compose.sqlite.yml up --build
services:
  api:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_DIALECT: sqlite
      SQLITE_PATH: /app/data/alternance.db
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./data:/app/data
